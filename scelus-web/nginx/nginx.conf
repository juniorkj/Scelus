server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compressão
    gzip on;
    gzip_types text/plain application/javascript application/json text/css;
    gzip_min_length 1024;

    # Cache para assets com hash (Angular build)
    location ~* "\.[0-9a-f]{8}\.(js|css|woff2?)$" {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cache curto para index.html (nunca fazer cache longo)
    location = /index.html {
        expires 0;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Proxy reverso para a API (Configurado com variável para não travar o boot se o host não existir)
    location /scelus-api/ {
        resolver 127.0.0.11 valid=30s;
        set $upstream_api "scelus-api";
        proxy_pass http://$upstream_api:8080/scelus-api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA — redirecionar todas as rotas para index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Segurança — headers HTTP
    add_header X-Frame-Options         "SAMEORIGIN"   always;
    add_header X-Content-Type-Options  "nosniff"      always;
    add_header X-XSS-Protection        "1; mode=block" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
}
