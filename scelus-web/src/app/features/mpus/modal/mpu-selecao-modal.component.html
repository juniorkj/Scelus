<tj-search-field-dialog-content [client]="this">
  <tj-filters [client]="this">
    <div class="row g-2">
      <div class="col-md-4">
        <tj-input
          label="Nº da MPU"
          name="numeroMpu"
          [(ngModel)]="searchParams['numeroMpu']"
          placeholder="Número da MPU...">
          <tj-icon input-prefix icon="Shield"></tj-icon>
        </tj-input>
      </div>
      <div class="col-md-4">
        <tj-input
          label="Número do Processo"
          name="numeroUnico"
          [(ngModel)]="searchParams['numeroUnico']"
          mask="0000000-00.0000.0.00.0000"
          placeholder="Ex: 0800123-45.2026.8.10.0001">
          <tj-icon input-prefix icon="FileText"></tj-icon>
        </tj-input>
      </div>
      <div class="col-md-4">
        <tj-select
          label="Concedida?"
          name="concedida"
          [(ngModel)]="searchParams['concedida']"
          [options]="concedidaOptions"
          placeholder="Todas"></tj-select>
      </div>
    </div>
  </tj-filters>

  <tj-table
    #tjTable
    [client]="this"
    [columns]="columns"
    [forSelection]="true"
    [(tjItemsSelecionados)]="itemsSelecionados"
    title="Medidas Protetivas de Urgência"
    description="Selecione uma ou mais MPUs para vincular a este fato.">
    <table mat-table [dataSource]="tjTable.dataSource.result">
      <ng-container matColumnDef="numeroMpu">
        <th
          mat-header-cell
          *matHeaderCellDef
          tj-row-selection
          [tjRowSelectionElement]="null">
          {{ columns.numeroMpu }}
        </th>
        <td
          mat-cell
          *matCellDef="let m"
          tj-row-selection
          [tjRowSelectionElement]="m">
          {{ m.numeroMpu || '—' }}
        </td>
      </ng-container>

      <ng-container matColumnDef="numeroUnico">
        <th mat-header-cell *matHeaderCellDef>{{ columns.numeroUnico }}</th>
        <td mat-cell *matCellDef="let m">{{ m.numeroUnico || '—' }}</td>
      </ng-container>

      <ng-container matColumnDef="dataDecisao">
        <th mat-header-cell *matHeaderCellDef>{{ columns.dataDecisao }}</th>
        <td mat-cell *matCellDef="let m">
          {{ m.dataDecisao | date: 'dd/MM/yyyy' }}
        </td>
      </ng-container>

      <ng-container matColumnDef="concedida">
        <th mat-header-cell *matHeaderCellDef>{{ columns.concedida }}</th>
        <td mat-cell *matCellDef="let m">
          <span
            class="badge"
            [class.bg-success]="m.concedida === 'S'"
            [class.bg-secondary]="m.concedida === 'N'">
            {{ m.concedida === 'S' ? 'Sim' : 'Não' }}
          </span>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="tjTable.columnKeys"></tr>
      <tr mat-row *matRowDef="let row; columns: tjTable.columnKeys"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td
          class="mat-cell text-center py-4"
          [attr.colspan]="tjTable.columnKeys.length">
          Nenhuma medida protetiva de urgência localizada.
        </td>
      </tr>
    </table>
  </tj-table>
</tj-search-field-dialog-content>
