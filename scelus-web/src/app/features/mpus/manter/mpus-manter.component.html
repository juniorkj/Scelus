<tj-page [back]="true" [navegacao]="navigation" [title]="title">
  <tj-card [nonExpansive]="true">
    <form #form="ngForm">
      <h6 class="section-title">
        <tj-icon icon="Shield"></tj-icon>
        Dados da Medida Protetiva
      </h6>
      <div class="row g-2">
        <div class="col-md-3">
          <tj-input
            label="Nº da MPU"
            name="numeroMpu"
            [required]="true"
            [readonly]="readonly"
            [(ngModel)]="entity.numeroMpu"
            placeholder="Ex: MPU-2026-0001"></tj-input>
        </div>
        <div class="col-md-4">
          <tj-input
            label="Número do Processo"
            name="numeroUnico"
            [readonly]="readonly"
            [(ngModel)]="entity.numeroUnico"
            mask="0000000-00.0000.0.00.0000"
            placeholder="Ex: 0800123-45.2026.8.10.0001"></tj-input>
        </div>
        <div class="col-md-3">
          <tj-date-picker
            label="Data da Decisão"
            name="dataDecisao"
            [required]="true"
            [readonly]="readonly"
            [(ngModel)]="entity.dataDecisao"></tj-date-picker>
        </div>
        <div class="col-md-2">
          <tj-radio
            label="Concedida?"
            name="concedida"
            [required]="true"
            [readonly]="readonly"
            [toLineInForm]="true"
            [options]="simNaoOptions"
            [(ngModel)]="entity.concedida"></tj-radio>
        </div>
      </div>

      <div class="row g-2 mt-1">
        <div class="col-md-12">
          <tj-textarea
            label="Legislação / Fundamento"
            name="legislacaoFundamento"
            [required]="true"
            [readonly]="readonly"
            [(ngModel)]="entity.legislacaoFundamento"></tj-textarea>
        </div>
      </div>

      <hr />
      <h6 class="section-title">
        <tj-icon icon="Bell"></tj-icon>
        Intimações e Ciência
      </h6>
      <div class="row g-2">
        <div class="col-md-3">
          <tj-date-picker
            label="Intimação do Acusado"
            name="dataIntimacaoAcusado"
            [required]="true"
            [readonly]="readonly"
            [(ngModel)]="entity.dataIntimacaoAcusado"></tj-date-picker>
        </div>
        <div class="col-md-3">
          <tj-date-picker
            label="Intimação da Vítima"
            name="dataIntimacaoVitima"
            [required]="true"
            [readonly]="readonly"
            [(ngModel)]="entity.dataIntimacaoVitima"></tj-date-picker>
        </div>
        <div class="col-md-3">
          <tj-date-picker
            label="Ciência do Acusado"
            name="dataCienciaAcusado"
            [readonly]="readonly"
            [(ngModel)]="entity.dataCienciaAcusado"></tj-date-picker>
        </div>
        <div class="col-md-3">
          <tj-date-picker
            label="Ciência da Vítima"
            name="dataCienciaVitima"
            [readonly]="readonly"
            [(ngModel)]="entity.dataCienciaVitima"></tj-date-picker>
        </div>
      </div>

      <hr />
      <h6 class="section-title">
        <tj-icon icon="ClipboardList"></tj-icon>
        Situação
      </h6>
      <div class="row g-2">
        <div class="col-md-3">
          <tj-radio
            label="Pedido de Desistência?"
            name="pedidoDesistencia"
            [required]="true"
            [readonly]="readonly"
            [toLineInForm]="true"
            [options]="simNaoOptions"
            [(ngModel)]="entity.pedidoDesistencia"></tj-radio>
        </div>
        <div class="col-md-3">
          <tj-radio
            label="Inquérito Instaurado?"
            name="inqueritoInstaurado"
            [required]="true"
            [readonly]="readonly"
            [toLineInForm]="true"
            [options]="simNaoOptions"
            [(ngModel)]="entity.inqueritoInstaurado"></tj-radio>
        </div>
        <div class="col-md-3">
          <tj-date-picker
            label="Data Fim de Vigência"
            name="dataFimVigencia"
            [readonly]="readonly"
            [(ngModel)]="entity.dataFimVigencia"></tj-date-picker>
        </div>
        <div class="col-md-3">
          <tj-textarea
            label="Observações"
            name="observacoes"
            [readonly]="readonly"
            [(ngModel)]="entity.observacoes"></tj-textarea>
        </div>
      </div>
    </form>

    <tj-card-footer>
      <tj-acao-pagina
        [client]="this"
        [form]="form"
        [esconderExcluir]="actionType !== 'UPDATE'"></tj-acao-pagina>
    </tj-card-footer>
  </tj-card>
</tj-page>
