##############################################################################
# application-test.yml
# Profile ativo nos testes: @ActiveProfiles("test")
# Garante que o SentinelaFilter não bloqueie endpoints nos @WebMvcTest
##############################################################################
sentinela:
  enabled: false

spring:
  datasource:
    postgres:
      url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
      username: sa
      password:
      driver-class-name: org.h2.Driver
    sentinela:
      url: jdbc:h2:mem:sentineladb;DB_CLOSE_DELAY=-1
      username: sa
      password:
      driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: none

logging:
  level:
    br.jus.tjma.scelus: DEBUG
